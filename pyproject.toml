[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-apartment-hunter-tlv"
version = "0.1.0"
description = "A zero-cost, user-fed Telegram apartment filter for central Tel Aviv"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
apartment-hunter = "apartment_hunter.bot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

