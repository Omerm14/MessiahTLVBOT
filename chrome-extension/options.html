<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Apartment Hunter TLV</title>
    <style>
      body { font: 16px system-ui; max-width: 760px; margin: 36px auto; padding: 0 20px; color: #172033; }
      label { display: block; font-weight: 650; margin-top: 22px; }
      textarea, input { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 7px; }
      textarea { min-height: 180px; direction: ltr; }
      button { margin-top: 24px; padding: 11px 24px; font-weight: 700; }
      .note { background: #fff5d7; padding: 12px; border-radius: 8px; }
      #status { margin-top: 16px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Apartment Hunter TLV</h1>
    <p class="note">התוסף קורא בלבד. הוא לא מגיב, מפרסם או שולח הודעות בפייסבוק. יש להשאיר את Chrome פתוח ומחובר לפייסבוק.</p>
    <label>קישורי הקבוצות — קישור אחד בכל שורה
      <textarea id="groupUrls" placeholder="https://www.facebook.com/groups/..."></textarea>
    </label>
    <label>כל כמה דקות לבדוק (מינימום 10)
      <input id="intervalMinutes" type="number" min="10" max="180" value="15">
    </label>
    <label>הסוד המקומי המשותף
      <input id="sharedSecret" type="password" autocomplete="off">
    </label>
    <label><input id="enabled" type="checkbox" style="width:auto"> הפעל ניטור</label>
    <button id="save">שמור</button>
    <div id="status"></div>
    <script src="options.js"></script>
  </body>
</html>
