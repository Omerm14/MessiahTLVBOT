name: Tests

on:
  push:
    branches-ignore: [data]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run extension parser tests
        run: node tests/extension_parser.test.js
      - name: Run extension scanner tests
        run: node tests/extension_background.test.js
      - name: Check shared files are identical in the web app and the extension
        run: |
          for f in parser.js sync.js rules.json default-groups.js; do
            cmp "docs/$f" "chrome-extension/$f" || { echo "docs/$f and chrome-extension/$f differ"; exit 1; }
          done
