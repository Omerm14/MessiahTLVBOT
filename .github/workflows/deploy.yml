name: Deploy

# Every push to main: apply new database migrations, then deploy the app and API
# to Cloudflare Pages (https://messiah-4rr.pages.dev).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Add the CLOUDFLARE_API_TOKEN repository secret (see SETUP.md)"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Add the CLOUDFLARE_ACCOUNT_ID repository secret (see SETUP.md)"; exit 1; }
      - run: npm ci
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply messiah --remote
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy --project-name messiah --branch main --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --pretty=%s)"
