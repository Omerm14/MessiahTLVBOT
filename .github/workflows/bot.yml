name: Apartment Hunter Bot

# Manual only. The bot now answers Telegram from the Mac (scripts/run_local_collector.sh).
# A schedule here would fight the Mac over Telegram updates and use up the
# private-repo Actions minutes within about a week.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apartment-hunter-state
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}
      APARTMENT_DB_PATH: data/apartments.db
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate configuration
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || (echo "Missing TELEGRAM_BOT_TOKEN secret" && exit 1)
      - name: Check Telegram once
        run: PYTHONPATH=src python -m apartment_hunter.bot --once
      - name: Persist bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/apartments.db
          git diff --cached --quiet && exit 0
          git commit -m "chore: persist apartment bot state [skip ci]"
          git push

