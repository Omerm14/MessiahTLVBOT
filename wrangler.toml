# Cloudflare Pages project for Messiah: the static app in docs/, the API in functions/.
name = "messiah"
pages_build_output_dir = "docs"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "messiah"
database_id = "7604a501-6930-4857-bb26-f689e0141eed"
migrations_dir = "migrations"

# OWNER_EMAIL, ACCESS_TEAM_DOMAIN and ACCESS_AUD are Pages secrets (wrangler pages secret put),
# so personal details stay out of this public repository.
